<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табличка для короба — Не гречкой единой</title>
<meta name="description" content="Табличка А5 с QR-кодом для короба «Корзины доброты».">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/golos-text.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fira-xc-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<style>
  @page { size: A5 portrait; margin: 10mm; }
  body { background: var(--shelf); }
  .sheet-tools { max-width: 148mm; margin: 0 auto; padding: 1rem 0; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; }
  .sheet {
    width: 148mm; min-height: 210mm; margin: 0 auto 2rem; padding: 10mm; background: #fff; color: #000;
    display: flex; flex-direction: column; gap: 5mm; box-sizing: border-box;
  }
  .sheet h1 { font: 600 40pt/1 var(--cond); max-width: none; }
  .sheet .lead { font: 400 14pt/1.35 var(--sans); }
  .sheet .qr { width: 60mm; height: 60mm; margin: 0 auto; }
  .sheet .qr img { width: 100%; height: 100%; }
  .sheet .url { text-align: center; font: 400 11pt/1.3 var(--sans); overflow-wrap: anywhere; }
  .sheet .tag { border: 1.5pt solid #000; background: #ffe03d; color: #000; }
  .sheet .tag-num { font-size: 56pt; }
  .sheet .tag-unit { font-size: 22pt; }
  .sheet .tag-sub { font-size: 13pt; }
  .sheet .fine { font: 400 10pt/1.35 var(--sans); margin-top: auto; }
  @media (max-width: 600px) {
    .sheet { width: 100%; min-height: 0; padding: 1.25rem; }
    .sheet h1 { font-size: 2.4rem; }
    .sheet .qr { width: 60%; height: auto; aspect-ratio: 1; }
    .sheet .tag-num { font-size: 3.5rem; }
    .sheet-tools { padding: 1rem; }
  }
  @media print {
    body { background: #fff; }
    .sheet-tools { display: none !important; }
    .sheet { width: auto; min-height: 0; height: 188mm; margin: 0; padding: 0; gap: 4mm; overflow: hidden; }
    .sheet h1 { font-size: 36pt; }
    .sheet .lead { font-size: 13pt; }
    .sheet .qr { width: 50mm; height: 50mm; }
    .sheet .tag { background: #fff; }
  }
</style>
<script type="module" src="js/tablichka.js"></script>
</head>
<body>
<div class="sheet-tools no-print">
  <a href="./kak-schitaem.html#h-sheet">Как это считается</a>
  <button type="button" class="btn" id="print">Распечатать табличку</button>
</div>
<main class="sheet" aria-labelledby="sheet-h">
  <h1 id="sheet-h">Что положить в этот короб</h1>
  <p class="lead">Наведите камеру на код — покажем товары, где на 150, 300 или 500 ₽ больше всего калорий и белка, включая животный.</p>
  <div class="qr"><img src="img/qr-korob.svg" alt="QR-код со ссылкой на список для короба"></div>
  <p class="url" id="url"></p>
  <div class="tag" id="tag" role="group" aria-label="Список на 300 ₽">
    <p class="tag-top">На 300 ₽</p>
    <p class="tag-main"><span class="tag-num" id="days">…</span><span class="tag-unit" id="unit">дня</span></p>
    <p class="tag-sub">калорий и белка, включая животный, одному взрослому</p>
    <p class="tag-bar" id="base">&nbsp;</p>
  </div>
  <p class="fine" id="fine">Только то, что хранится без холодильника. Независимый проект.</p>
</main>
</body>
</html>
